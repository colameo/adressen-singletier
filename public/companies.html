<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
  <script>window.PISA_PAGE = {"api":"api/companies","id":"id","idGenerated":true,"idNumber":true,"fields":[{"name":"name","kind":"value","rules":{"required":true}}],"refs":[],"tables":["employees"],"pageSize":10,"texts":{"newHeading":"New Company","editHeading":"Edit Company","viewHeading":"View Company","create":"Create","save":"Save","cancel":"Cancel"},"parts":[]};</script>
  <script src="https://cdn.jsdelivr.net/npm/validator@13.15.35/validator.min.js"></script>
  <script type="module" src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand bg-dark border-bottom" data-bs-theme="dark">
    <div class="container d-flex flex-wrap align-items-center gap-2">
      <a class="navbar-brand" href="index.html">Home</a>
      <div class="navbar-nav flex-row flex-wrap">
        <a class="nav-link px-2" href="persons.html">Persons</a>
        <a class="nav-link px-2 active" href="companies.html" aria-current="page">Companies</a>
      </div>
      <div class="data-menu ms-auto position-relative">
        <button type="button" class="btn btn-outline-light btn-sm" id="data-menu-button" aria-label="Data menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>
        <div class="dropdown-menu dropdown-menu-end" id="data-menu-list" style="right: 0; left: auto; min-width: 13rem">
          <button type="button" class="dropdown-item" id="save-data">Save data</button>
          <label class="dropdown-item mb-0" role="button" style="font-size: 1rem">Load data<input type="file" id="load-data" accept="application/json,.json" hidden></label>
          <button type="button" class="dropdown-item" id="reset-data" hidden>Reset to example data</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="container py-4" x-data="crud(window.PISA_PAGE)">
    <h1 class="h3 mb-4">Companies</h1>
    <p class="error alert alert-danger" x-show="error" x-text="error"></p>

    <form class="card card-body shadow-sm mb-4" novalidate @submit.prevent="save()">
      <h2 class="h5 mb-0" x-text="viewing ? window.PISA_PAGE.texts.viewHeading + ' ' + editing : editing === null ? window.PISA_PAGE.texts.newHeading : window.PISA_PAGE.texts.editHeading + ' ' + editing"></h2>
      <fieldset class="border rounded p-3">
        <label>Name
          <input class="form-control" type="text" name="name" x-model="form.name" :disabled="viewing" required @input="errors['name'] = ''" :class="{ invalid: errors['name'], 'is-invalid': errors['name'] }">
          <span class="field-error text-danger small" x-show="errors['name']" x-text="errors['name']"></span>
        </label>
        <div class="subtable">
          <span class="caption fw-semibold">Employees</span>
          <p class="empty text-muted mb-0" x-show="editing === null">Shown after saving.</p>
          <p class="empty text-muted mb-0" x-show="editing !== null && tables['employees'].total === 0">None yet.</p>
          <table class="table table-sm table-bordered mb-0" x-show="editing !== null && tables['employees'].total > 0">
            <thead class="table-light">
              <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in tables['employees'].items" :key="row.id">
                <tr>
                  <td x-text="show(row.firstName)"></td>
                  <td x-text="show(row.lastName)"></td>
                  <td x-text="show(row.email)"></td>
                  <td class="actions"><a class="btn btn-sm btn-outline-primary" :href="'persons.html#edit=' + encodeURIComponent(row.id)">Open</a></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="pager small text-muted" x-show="editing !== null && tables['employees'].pages > 1">
            <button type="button" class="btn btn-sm btn-outline-secondary" @click="loadTable('employees', tables['employees'].page - 1)" :disabled="tables['employees'].page === 0">Previous</button>
            <span x-text="'Page ' + (tables['employees'].page + 1) + ' of ' + tables['employees'].pages"></span>
            <button type="button" class="btn btn-sm btn-outline-secondary" @click="loadTable('employees', tables['employees'].page + 1)" :disabled="tables['employees'].page >= tables['employees'].pages - 1">Next</button>
          </div>
        </div>
      </fieldset>
      <div class="buttons d-flex gap-2">
        <button type="submit" class="btn btn-primary" x-show="!viewing" x-text="editing === null ? window.PISA_PAGE.texts.create : window.PISA_PAGE.texts.save"></button>
        <button type="button" class="btn btn-primary" x-show="viewing" @click="startEdit()">Edit</button>
        <button type="button" class="btn btn-outline-secondary" x-show="viewing" @click="reset()">Close</button>
        <button type="button" class="btn btn-outline-secondary" x-show="editing !== null && !viewing" @click="reset()">Cancel</button>
      </div>
    </form>

    <p class="empty text-muted mb-0" x-show="items.length === 0">No entries yet.</p>
    <table class="table table-hover align-middle bg-body shadow-sm rounded" x-show="items.length > 0">
      <thead class="table-light">
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id">
          <tr class="clickable" @click="view(item)">
            <td x-text="show(item.id)"></td>
            <td x-text="show(item.name)"></td>
            <td class="actions">
              <button type="button" class="btn btn-sm btn-outline-primary" @click.stop="edit(item)">Edit</button>
              <button type="button" class="btn btn-sm btn-outline-danger" @click.stop="remove(item)">Delete</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    <div class="pager small text-muted" x-show="list.pages > 1">
      <button type="button" class="btn btn-sm btn-outline-secondary" @click="goTo(list.page - 1)" :disabled="list.page === 0">Previous</button>
      <span x-text="'Page ' + (list.page + 1) + ' of ' + list.pages + ' (' + list.total + ' entries)'"></span>
      <button type="button" class="btn btn-sm btn-outline-secondary" @click="goTo(list.page + 1)" :disabled="list.page >= list.pages - 1">Next</button>
    </div>
  </main>
</body>
</html>
